# The instance you daily-drive. Bound to 127.0.0.1 on purpose: this holds API
# tokens for four services and is never meant to be reachable off this machine.
name: control-room

services:
  control-room:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod
    image: control-room:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      # The gh CLI reads GH_TOKEN; we keep one canonical name in .env.
      GH_TOKEN: ${GITHUB_TOKEN:-}
      CONTROL_ROOM_DATA_DIR: /workspace/data
    ports:
      # Defaults to loopback. Set CONTROL_ROOM_BIND=0.0.0.0 in .env to reach it
      # from other machines — only worth doing now that there is a password, and
      # ideally behind TLS or a private network, since plain HTTP sends it in
      # the clear.
      - "${CONTROL_ROOM_BIND:-127.0.0.1}:${CONTROL_ROOM_PORT:-4331}:4321"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      # Site registry, saved runs and captured artifacts survive rebuilds.
      - ./data:/workspace/data
    # Chromium crashes on Docker's default 64MB /dev/shm.
    shm_size: "1gb"
