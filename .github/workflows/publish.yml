name: Publish image

# Pushes to main produce a :main image to try out; a GitHub Release produces the
# versioned tags and moves :latest. Deployments track :latest, so cutting a
# release is the deliberate act that updates anyone running it.
on:
  push:
    branches: [main]
    # Docs don't reach the prod image (it copies only dist/, server/ and
    # package.json), so a prose-only push has nothing to rebuild. Releases and
    # manual runs always build regardless of what changed.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Each architecture is built on a runner of that architecture and pushed by
  # digest only (no tag). Building arm64 on an amd64 runner would mean QEMU, and
  # emulating an `npm install` plus an Astro build through a ~2.8GB Playwright
  # base is slow enough to risk timing the job out. GitHub's arm64 runners are
  # free for public repositories, so there is no reason to emulate.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided automatically; no secret to create.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only (org.opencontainers.image.revision and friends); tagging
      # still happens in the merge job. The revision label matters beyond
      # provenance: the in-app update check reads it off the registry to decide
      # whether the tag has moved on from the running install.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # The same identity, baked into the environment so the running app
          # knows what it is (see src/lib/update.ts). VERSION is the release tag
          # when a release triggered this, otherwise the branch name.
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
            IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # No tags here — the merge job below is what names the image. Pushing
          # a tag from each arch would have them overwrite each other instead of
          # combining into one multi-arch image.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per platform so the two builds don't evict each other's cache.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # The merge job reassembles "sha256:<hex>" from the filename, so store
          # the bare hex — a filename can't contain a colon on every filesystem.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          # One artifact per platform; the merge job globs them back together.
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-architecture images into a single tagged manifest list, so
  # `docker pull` picks the right one automatically.
  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
